[workspace]
resolver = "2"
members = [
    "crates/things-core",
    "crates/things-cli",
    "crates/things-mcp",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/guangzan/things"
homepage = "https://github.com/guangzan/things"
description = "Production-grade, AI-first Things 3 CLI and MCP server"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
directories = "6.0"
regex = "1.11"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "1.0", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
predicates = "3.1"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "process", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
tap = "guangzan/homebrew-tap"
publish-jobs = ["./release-homebrew"]
pr-run-mode = "plan"
plan-jobs = ["./release-preflight"]

